taller_ventas:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', 'taller_dbt_analytics') }}"
      auth_type: oauth
      threads: 1
      connect_timeout: 120
      connect_retries: 2
    pat:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', 'taller_dbt_analytics') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN', '') }}"
      threads: 1
      connect_timeout: 120
      connect_retries: 2
