# Airflow local + servicios de AWS
#
# Servicios:
#   postgres   -> base de metadatos de Airflow
#   airflow-*  -> Airflow 3 con LocalExecutor (sin Redis ni workers de Celery)
#
# Los datos y el cómputo están en AWS (S3, Glue, Athena): Airflow solo orquesta.
# UI de Airflow: http://localhost:8082  (usuario: airflow / clave: airflow)
#
# Antes de levantarlo: cp .env.example .env  y edita AWS_BUCKET (ver README.md)

x-airflow-common:
  &airflow-common
  build: .
  env_file:
    - .env          # AIRFLOW_UID, AWS_BUCKET y la Connection AIRFLOW_CONN_AWS_CURSO
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: 'fundamentos_aws_jwt_secret'
    # Perfil "curso" de tu máquina, montado en solo lectura (opción A del README)
    AWS_CONFIG_FILE: /opt/airflow/.aws/config
    AWS_SHARED_CREDENTIALS_FILE: /opt/airflow/.aws/credentials
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro              # staging/ y reportes/ del ETL local
    - ./glue_jobs:/opt/airflow/glue_jobs:ro    # script del Glue Job
    - ${HOME}/.aws:/opt/airflow/.aws:ro        # credenciales: nunca dentro de la imagen
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8082:8080"   # 8082 para no chocar con etl_ventas (8081) ni fundamentos_airflow (8080)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Migra la base de metadatos, crea el usuario admin y prepara las carpetas
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

volumes:
  postgres-db-volume:
